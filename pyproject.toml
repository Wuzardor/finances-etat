[project]
name = "finances-etat"
version = "0.1.0"
description = "Collecte, stockage et visualisation des recettes et dépenses de l'État français à partir de l'open data"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1",
    "pandas>=2.2",
    "plotly>=5.24",
    "requests>=2.32",
    "streamlit>=1.40",
]

[project.scripts]
finances-etat = "finances_etat.pipeline:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["finances_etat"]

[tool.pytest.ini_options]
testpaths = ["tests"]
